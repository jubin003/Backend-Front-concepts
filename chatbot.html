<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>


    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>




    <script type="text/babel">

        function ChatInput(){
            return (
                <>
                    <input 
                        placeholder="send a message to chatbot" 
                        size="30" />
                    <button>Send</button>
                </>
            );
        }

        function ChatMessage({message,sender}){
            //const message=props.message;
            //const {sender}=props;
            // if(sender==='bot'){
            //      return (
            //     <div>                    
            //         <img src="./robot.png" width="40"></img>
            //         {message}
            //     </div>
            // );
            // }

                return(

                    <div>
                        {sender ==='bot'&&<img src="./robot.png" width="40"></img>}
                        {message}
                        {sender ==='user' && <img src="./user.png" width="40"></img>}
                    </div>
                );

           
        }

        function App(){
            return (
                  <>
                    <ChatInput />
                    <ChatMessage message="hello chatbot" sender="user"/>
                    <ChatMessage message="hello how can i help you?" sender="bot"/>
                    <ChatMessage message="can you get me todays date?" sender="user" />
                    <ChatMessage message="Today is April 13th" sender="bot"/>
                </>
            );
              
             
        }

        


      const container= document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
